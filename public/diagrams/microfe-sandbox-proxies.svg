<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #FAF9F6; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; font-size: 19px; font-weight: 700; fill: #1C1A17; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; font-size: 12.5px; fill: #57534E; }
      .code-font { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 11px; }
      .side-card { rx: 10px; stroke-width: 1.5; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.03)); }
      .box-unit { rx: 6px; stroke-width: 1; }
      .badge-tag { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; }
      .arrow { stroke: #A8A29E; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A8A29E" />
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#EA580C" />
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" fill="#FAF9F6" rx="12" />
  <rect x="1" y="1" width="878" height="538" fill="none" stroke="#E7E5E0" stroke-width="1.5" rx="11" />

  <!-- Header -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="138" height="22" rx="4" fill="#F6E8DC" />
    <text x="69" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#B4530A">qiankun 沙箱架构</text>
    <text x="0" y="44" class="text-title">微前端 JS 沙箱隔离核心实现机制对比</text>
    <text x="0" y="64" class="text-sub">快照沙箱（SnapshotSandbox 单实例） vs 多实例代理沙箱（ProxySandbox）的内存流转与拦截原理</text>
  </g>

  <!-- Left: Snapshot Sandbox -->
  <g transform="translate(32, 105)">
    <rect width="395" height="400" class="side-card" fill="#FFFFFF" stroke="#FED7AA" />
    <rect x="16" y="14" width="84" height="20" rx="4" fill="#EA580C" />
    <text x="58" y="28" text-anchor="middle" class="badge-tag" fill="#FFFFFF">单实例方案</text>
    <text x="108" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#9A3412">快照沙箱 (SnapshotSandbox)</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#57534E">依赖全量 window 遍历比对，兼容旧版浏览器 (IE11)</text>

    <!-- Step 1: Active -->
    <g transform="translate(16, 68)">
      <rect width="363" height="68" class="box-unit" fill="#FFF7ED" stroke="#FDBA74" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#C2410C">1. 激活挂载 (active)</text>
      <text x="12" y="38" class="code-font" fill="#7C2D12">for (const k in window) windowSnapshot[k] = window[k]</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#9A3412">遍历几十个甚至上百个全局属性，保存全量初始快照</text>
    </g>

    <!-- Downward arrow 1 -> 2 -->
    <path d="M 198 136 L 198 144" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-orange)" />

    <!-- Step 2: Running -->
    <g transform="translate(16, 146)">
      <rect width="363" height="68" class="box-unit" fill="#FEF2F2" stroke="#FECACA" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#B91C1C">2. 运行中直接污染物理 Window</text>
      <text x="12" y="38" class="code-font" fill="#991B1B">window.token = "AppA_Secret"; // 直接改写宿主全局！</text>
      <text x="12" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#DC2626">⚠️ 物理 window 处于受污染状态，无任何独立隔离层</text>
    </g>

    <!-- Downward arrow 2 -> 3 -->
    <path d="M 198 214 L 198 222" stroke="#EA580C" stroke-width="2" marker-end="url(#arr-orange)" />

    <!-- Step 3: Inactive -->
    <g transform="translate(16, 224)">
      <rect width="363" height="68" class="box-unit" fill="#FFF7ED" stroke="#FDBA74" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#C2410C">3. 卸载恢复 (inactive)</text>
      <text x="12" y="38" class="code-font" fill="#7C2D12">再次遍历 window，比对差异写入 modifyPropsMap</text>
      <text x="12" y="56" class="code-font" fill="#7C2D12">window[k] = windowSnapshot[k]; // 强行回滚宿主状态</text>
    </g>

    <!-- Pain Point Box -->
    <g transform="translate(16, 304)">
      <rect width="363" height="80" rx="6" fill="#FFF1F2" stroke="#FDA4AF" stroke-width="1.5" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#BE123C">❌ 致命短板与缺陷：</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#9F1239">• 每次切路由均需 O(N) 遍历整个庞大 window 对象，性能差</text>
      <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#E11D48">• 无法支持同屏共存两个子应用（状态直接互相覆盖踩踏！）</text>
    </g>
  </g>

  <!-- Right: Proxy Sandbox -->
  <g transform="translate(450, 105)">
    <rect width="398" height="400" class="side-card" fill="#FFFFFF" stroke="#86EFAC" />
    <rect x="16" y="14" width="84" height="20" rx="4" fill="#16A34A" />
    <text x="58" y="28" text-anchor="middle" class="badge-tag" fill="#FFFFFF">多实例方案</text>
    <text x="108" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#166534">代理沙箱 (ProxySandbox · 现代默认)</text>
    <text x="16" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#57534E">为每个子应用构建专属 fakeWindow 与 Proxy 拦截器</text>

    <!-- Shared Host Raw Window -->
    <g transform="translate(16, 68)">
      <rect width="366" height="48" class="box-unit" fill="#F8FAFC" stroke="#CBD5E1" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#334155">宿主原生真实 Window (Raw Window · 始终只读/未受污染)</text>
      <text x="12" y="36" class="code-font" fill="#64748B">包含原生 document, location, fetch, 全局不可变基础 API</text>
    </g>

    <!-- Read Fallback Arrows from Raw Window to Proxies -->
    <path d="M 104 116 L 104 124" stroke="#16A34A" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arr-green)" />
    <path d="M 294 116 L 294 124" stroke="#2563EB" stroke-width="1.8" stroke-dasharray="3 2" marker-end="url(#arr-green)" />
    <text x="199" y="122" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#64748B">回退委托 (Fallback)</text>

    <!-- Sub App A & B Side-by-Side Proxies -->
    <g transform="translate(16, 126)">
      <!-- Sub App A -->
      <rect width="176" height="165" class="box-unit" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
      <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#15803D">子应用 A 专属沙箱</text>
      <rect x="10" y="28" width="156" height="44" rx="4" fill="#FFFFFF" stroke="#BBF7D0" />
      <text x="16" y="44" class="code-font" font-weight="700" fill="#166534">fakeWindowA</text>
      <text x="16" y="60" class="code-font" font-size="10" fill="#15803D">token = "Token_A"</text>
      
      <text x="12" y="88" class="code-font" font-weight="700" fill="#166534">Proxy A 拦截机制：</text>
      <text x="12" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#166534">• set: 仅写入 fakeWindowA</text>
      <text x="12" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#166534">• get: 优先 fakeWindowA</text>
      <text x="12" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#166534">• 未命中: 回退读宿主 Window</text>
      <text x="12" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#166534">• 原生方法自动 bind(raw)</text>

      <!-- Sub App B -->
      <g transform="translate(190, 0)">
        <rect width="176" height="165" class="box-unit" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" />
        <text x="12" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#1D4ED8">子应用 B 专属沙箱</text>
        <rect x="10" y="28" width="156" height="44" rx="4" fill="#FFFFFF" stroke="#BFDBFE" />
        <text x="16" y="44" class="code-font" font-weight="700" fill="#1E40AF">fakeWindowB</text>
        <text x="16" y="60" class="code-font" font-size="10" fill="#2563EB">token = "Token_B"</text>

        <text x="12" y="88" class="code-font" font-weight="700" fill="#1E40AF">Proxy B 拦截机制：</text>
        <text x="12" y="104" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#1E40AF">• set: 仅写入 fakeWindowB</text>
        <text x="12" y="118" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#1E40AF">• get: 优先 fakeWindowB</text>
        <text x="12" y="132" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#1E40AF">• 未命中: 回退读宿主 Window</text>
        <text x="12" y="148" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#1E40AF">• 原生方法自动 bind(raw)</text>
      </g>
    </g>

    <!-- Key Advantages Box -->
    <g transform="translate(16, 304)">
      <rect width="366" height="80" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5" />
      <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#166534">✅ 核心工程优势：</text>
      <text x="14" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#15803D">• 真正实现多实例共存（多个子应用同屏展示，全局变量互不踩踏）</text>
      <text x="14" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#14532D">• 卸载时直接销毁该子应用的 Proxy 实例，零 O(N) 遍历开销，极速回收</text>
    </g>
  </g>
</svg>
