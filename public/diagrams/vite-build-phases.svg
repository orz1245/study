<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="auto">
  <defs>
    <style>
      .bg { fill: #FAF9F6; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; font-size: 19px; font-weight: 700; fill: #1C1A17; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; font-size: 12.5px; fill: #57534E; }
      .code-font { font-family: ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 11px; }
      .side-card { rx: 10px; stroke-width: 1.5; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.03)); }
      .unit-box { rx: 6px; stroke-width: 1; }
      .badge-tag { font-family: -apple-system, BlinkMacSystemFont, sans-serif; font-size: 11px; font-weight: 700; }
      .arrow { stroke: #A8A29E; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <marker id="arr-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#A8A29E" />
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="540" fill="#FAF9F6" rx="12" />
  <rect x="1" y="1" width="878" height="538" fill="none" stroke="#E7E5E0" stroke-width="1.5" rx="11" />

  <!-- Header -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="138" height="22" rx="4" fill="#EEF2FF" />
    <text x="69" y="15" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#4F46E5">现代前端构建体系</text>
    <text x="0" y="44" class="text-title">Vite 架构与构建机制全景拓扑图</text>
    <text x="0" y="64" class="text-sub">开发服务器（Native ESM + Esbuild 依赖预构建） vs 生产构建（Rollup 全量静态优化）</text>
  </g>

  <!-- Dev Comparison Section -->
  <g transform="translate(32, 105)">
    <!-- Left: Traditional Bundler -->
    <g transform="translate(0, 0)">
      <rect width="360" height="295" class="side-card" fill="#FFFFFF" stroke="#E2E8F0" />
      <rect x="14" y="14" width="94" height="20" rx="4" fill="#64748B" />
      <text x="61" y="28" text-anchor="middle" class="badge-tag" fill="#FFFFFF">传统打包器模型</text>
      <text x="116" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#334155">Webpack 启动机制</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#64748B">冷启动时间复杂度 O(N)，依赖全量打包</text>

      <g transform="translate(14, 68)">
        <rect width="332" height="42" class="unit-box" fill="#F8FAFC" stroke="#CBD5E1" />
        <text x="12" y="18" class="code-font" font-weight="700" fill="#475569">1. Entry 静态分析与依赖抓取</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748B">递归遍历全部文件，在内存生成超大 AST 图</text>
      </g>

      <g transform="translate(14, 118)">
        <rect width="332" height="42" class="unit-box" fill="#F8FAFC" stroke="#CBD5E1" />
        <text x="12" y="18" class="code-font" font-weight="700" fill="#475569">2. 打包与生成 Bundle 产物</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#64748B">CJS/ESM 语法降级，拼接写入 MemoryFS</text>
      </g>

      <g transform="translate(14, 168)">
        <rect width="332" height="42" class="unit-box" fill="#FEF2F2" stroke="#FECACA" />
        <text x="12" y="18" class="code-font" font-weight="700" fill="#991B1B">3. 终于启动 Dev Server 伺服</text>
        <text x="12" y="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#DC2626">⏳ 项目越大，冷启动越慢（动辄 30~60 秒）</text>
      </g>

      <text x="14" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#64748B">热更新痛点：改动一个基础模块，常引发关联依赖链重新计算合并。</text>
    </g>

    <!-- Right: Vite Dev Server -->
    <g transform="translate(380, 0)">
      <rect width="436" height="295" class="side-card" fill="#FFFFFF" stroke="#818CF8" />
      <rect x="14" y="14" width="94" height="20" rx="4" fill="#4F46E5" />
      <text x="61" y="28" text-anchor="middle" class="badge-tag" fill="#FFFFFF">Vite 现代开发服务器</text>
      <text x="116" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13.5" font-weight="700" fill="#312E81">Native ESM 架构</text>
      <text x="14" y="52" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#4338CA">冷启动时间复杂度 O(1)，秒级极速就绪！</text>

      <!-- Step 1: Instant Start -->
      <g transform="translate(14, 68)">
        <rect width="408" height="46" class="unit-box" fill="#EEF2FF" stroke="#C7D2FE" />
        <text x="12" y="18" class="code-font" font-weight="700" fill="#3730A3">1. 立即启动轻量 HTTP Connect 服务 ($O(1)$ 秒开)</text>
        <text x="12" y="34" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" fill="#4F46E5">无需打包任何业务代码，直接准备接收浏览器请求</text>
      </g>

      <!-- Step 2: Esbuild Pre-bundling -->
      <g transform="translate(14, 122)">
        <rect width="408" height="58" class="unit-box" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
        <text x="12" y="18" class="code-font" font-weight="700" fill="#15803D">2. 依赖预构建 (Pre-bundling via Esbuild · Go 编写)</text>
        <text x="12" y="34" class="code-font" font-size="10" fill="#166534">• CJS ──► ESM 规范转换（支持浏览器 import）</text>
        <text x="12" y="48" class="code-font" font-size="10" fill="#166534">• 多小文件合并缓存至 .vite/deps（杜绝几百个 HTTP 请求风暴）</text>
      </g>

      <!-- Step 3: On-demand compilation -->
      <g transform="translate(14, 188)">
        <rect width="408" height="58" class="unit-box" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5" />
        <text x="12" y="18" class="code-font" font-weight="700" fill="#C2410C">3. 浏览器请求驱动：按需即时编译 (On-demand)</text>
        <text x="12" y="34" class="code-font" font-size="10" fill="#EA580C">• 浏览器请求: GET /src/App.vue ──► 动态单文件编译</text>
        <text x="12" y="48" class="code-font" font-size="10" fill="#EA580C">• Bare Import 重写: import 'react' ──► '/@id/react'</text>
      </g>

      <text x="14" y="272" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#4F46E5">HMR 优势：改动某个文件，仅向浏览器派发单个模块更新，毫秒生效！</text>
    </g>
  </g>

  <!-- Bottom Production Banner -->
  <g transform="translate(32, 415)">
    <rect width="816" height="95" rx="8" fill="#F3F1EC" stroke="#E7E5E0" stroke-width="1.5" />
    <rect x="16" y="14" width="76" height="20" rx="4" fill="#059669" />
    <text x="54" y="28" text-anchor="middle" class="badge-tag" fill="#FFFFFF">生产构建</text>
    <text x="100" y="29" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#065F46">为什么生产环境仍需 Rollup 全量打包？</text>

    <g transform="translate(16, 42)">
      <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#44403C" line-height="1.5">
        <tspan x="0" dy="0">• 消除网络瀑布：浏览器原生加载深层嵌套 ESM 会产生数十次网络往返 (RTT)，生产需合包合并；</tspan>
        <tspan x="0" dy="20">• 极致优化输出：依托 Rollup 强大的静态作用域分析，实现深度 Tree-Shaking 剔除死代码、动态 Code Splitting 与 CSS 提取。</tspan>
      </text>
    </g>
  </g>
</svg>
